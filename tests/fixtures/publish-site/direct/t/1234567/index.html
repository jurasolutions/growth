<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread · publish fixture</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #1c1c1c; }
header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #2f6b4f; color: #fff; display: grid; place-items: center; font-weight: 700; }
main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
textarea { width: 100%; min-height: 60px; font: inherit; box-sizing: border-box; }
button { font: inherit; padding: 8px 16px; }
.muted { color: #666; font-size: 14px; }
.message { white-space: pre-wrap; margin: 8px 0; }
</style>
</head>
<body>
<header><div class="avatar" aria-hidden="true">J</div><div><strong id="identity">jura_solutions</strong>
<div class="muted">Fixture social site for the inbox reply rehearsal (not a real platform)</div></div></header>
<main>
<div class="card">
  <p class="muted">Conversation with <strong>Priya Nair</strong></p>
  <div id="messages"><p class="message"><strong>Priya Nair</strong><br>Do you work with clinics?</p></div>
  <p id="request" hidden><button id="accept">Accept</button> <span class="muted">This person is asking to message you.</span></p>
  <p><label>Message <textarea id="field"></textarea></label></p>
  <button id="send">Send</button>
</div>
</main>
<script>
// Return sends at once, as in a real direct message: the rule the reply run's audit holds it to. Each
// send shows, so a split or a second send can be seen on the page. Add ?request=1 for a message request.
var field = document.getElementById("field");
var messages = document.getElementById("messages");
var request = new URLSearchParams(location.search).get("request") === "1";
document.getElementById("request").hidden = !request;
field.disabled = request;
document.getElementById("accept").addEventListener("click", function () {
  document.getElementById("request").hidden = true;
  field.disabled = false;
});
function send() {
  if (!field.value) return;
  var line = document.createElement("p");
  line.className = "message";
  line.textContent = field.value;
  messages.appendChild(line);
  field.value = "";
}
field.addEventListener("keydown", function (event) {
  if (event.key === "Enter") { event.preventDefault(); send(); }
});
document.getElementById("send").addEventListener("click", send);
</script>
</body>
</html>
