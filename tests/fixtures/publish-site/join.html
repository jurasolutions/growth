<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG test group · publish fixture</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #1c1c1c; }
header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #2f6b4f; color: #fff; display: grid; place-items: center; font-weight: 700; }
main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.notice { border-left: 4px solid #b3261e; }
textarea { width: 100%; min-height: 120px; font: inherit; box-sizing: border-box; }
button { font: inherit; padding: 8px 16px; }
.muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header><div class="avatar" aria-hidden="true">J</div><div><strong id="identity">Jura Solutions</strong>
<div class="muted">Fixture social site for the publish rehearsal (not a real platform)</div></div></header>
<main>
<div class="card"><h1>SG test group</h1>
<p class="muted">Private group · Joining as <strong>Jura Solutions</strong></p>
<button onclick="document.getElementById('questions').hidden = false">Join group</button></div>
<form class="card" id="questions" hidden aria-label="Membership questions">
  <h2>Answer questions to join</h2>
  <p><label>1. What does your business do? <textarea name="q1"></textarea></label></p>
  <p><label>2. Do you agree to the group rules? <input name="q2"></label></p>
  <button type="submit">Submit</button>
</form>
</main>

</body>
</html>
