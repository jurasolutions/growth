<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@jura_solutions · publish fixture (Instagram)</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #1c1c1c; }
header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #2f6b4f; color: #fff; display: grid; place-items: center; font-weight: 700; }
main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.notice { border-left: 4px solid #b3261e; }
textarea { width: 100%; min-height: 120px; font: inherit; box-sizing: border-box; }
button { font: inherit; padding: 8px 16px; }
.muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header><div class="avatar" aria-hidden="true">J</div><div><strong id="identity">jura_solutions</strong>
<div class="muted">Fixture social site for the publish rehearsal (not a real platform)</div></div></header>
<main>
<div class="card">
  <h1>@jura_solutions</h1>
  <p class="muted">Instagram · Posting as <strong>@jura_solutions</strong>, the Jura Solutions Instagram account</p>
</div>
<form class="card" id="composer" aria-label="Create post">
  <h2>New post</h2>
  <label for="text">Write a caption…</label>
  <textarea id="text" name="text"></textarea>
  <p><label for="photo">Photo/video</label> <input id="photo" name="photo" type="file" accept="image/*" multiple></p>
  <p id="attached" class="muted">No photo attached.</p>
  <button type="submit">Post</button>
</form>
</main>
<script>
document.getElementById("photo").addEventListener("change", function (e) {
  var names = Array.prototype.map.call(e.target.files, function (f) { return f.name; });
  document.getElementById("attached").textContent = names.length ? "Attached: " + names.join(", ") : "No photo attached.";
});
document.getElementById("composer").addEventListener("submit", function (e) {
  e.preventDefault();
  var id = String(Date.now());
  localStorage.setItem("post-" + id, document.getElementById("text").value);
  localStorage.setItem("photos-" + id, document.getElementById("attached").textContent);
  location.href = "post.html?id=" + id;
});
</script>
</body>
</html>
