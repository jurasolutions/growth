[project]
name = "jura-growth"
version = "0.1.0"
description = "Jura Solutions growth engine: the shared plumbing and the agents that run on it"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "dnspython>=2.6",
]

[project.scripts]
jura-growth = "jura_growth.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jura_growth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
