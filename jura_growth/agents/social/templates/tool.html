<!doctype html>
<!-- Tool card: a toolbox tool from the site registry, with its address and
     the one green button. -->
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{width}}, height={{height}}">
<link rel="stylesheet" href="{{ds_styles}}">
<link rel="stylesheet" href="{{card_css}}">
</head>
<body class="{{classes}}">
<div class="card">
  <main class="main">
    <div class="intro">
      <div class="overline">{{overline}}</div>
      <h1 class="headline">{{{headline}}}</h1>
      <p class="subtitle">{{{subtitle}}}</p>
      <div class="tags">{{{tags}}}</div>
    </div>
    <div class="panel">
      <div class="url">{{tool_url}}</div>
      <div class="name">{{tool_name}}</div>
      <div class="button">{{button}}</div>
      <div class="note">{{note}}</div>
    </div>
  </main>
  <footer class="foot">
    <div class="lockup">{{{lockup}}}</div>
    <div class="site">{{site}}</div>
  </footer>
</div>
<script src="{{card_js}}"></script>
</body>
</html>
