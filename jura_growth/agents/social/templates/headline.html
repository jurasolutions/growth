<!doctype html>
<!-- Headline card: overline, headline, short subtitle, the post's diagram, jurasolutions.sg.
     Also the carousel slides (with their icon), the profile picture (mode-mark) and the covers. -->
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{width}}, height={{height}}">
<link rel="stylesheet" href="{{ds_styles}}">
<link rel="stylesheet" href="{{card_css}}">
</head>
<body class="{{classes}}">
<div class="card">
  <div class="mark-only" aria-hidden="true">{{{mark}}}</div>
  <div class="mark-white" aria-hidden="true">{{{mark_white}}}</div>
  <main class="main">
    <div class="intro">
      {{{tile}}}
      <div class="overline">{{overline}}</div>
      <h1 class="headline">{{{headline}}}</h1>
      <p class="subtitle">{{{subtitle}}}</p>
      <div class="caption">{{caption}}</div>
      <div class="site site-inline">{{site}}</div>
    </div>
    {{{visual}}}
  </main>
  <footer class="foot">
    <div class="lockup">{{{lockup}}}</div>
    <div class="site">{{site}}</div>
  </footer>
</div>
<script src="{{card_js}}"></script>
</body>
</html>
