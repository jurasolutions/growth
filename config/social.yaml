# Social content agent settings.
# PRD: jurasolutions/prd/pending/prd-jura-social-content-2026-10-24.md
#
# The 14-day no-repeat window and one post per platform per day are hard
# limits in jura_growth/caps.py, not settings.

# PRD open question 2. The rhythm includes Saturday and Sunday, so weekend
# posts are on until Ting Yu says otherwise. `false` makes the 07:30 job skip
# Saturdays and Sundays.
weekends: true

site: https://jurasolutions.sg

# --- the weekly rhythm (PRD §5.2, amended 2026-10-30) ------------------------
#
# Every post is about AI or automation, and each day of the week has its own
# kind of post (Ting Yu, 2026-10-30: new toolbox tools, AI fun facts, findings
# and good reads, and AI news, varied). If nothing good fits the day's theme,
# the run takes the next one in this order (the next day's theme, then the one
# after).
rhythm:
  mon: ai-this-week
  tue: ai-finding
  wed: from-the-toolbox
  thu: ai-fun-facts
  fri: ai-news
  sat: ai-good-read
  sun: automation-tip

# A theme posted in the last this many days is unavailable today, and submit
# refuses it, so a fallback never puts the same kind of post on two days
# running. 0 switches the rule off.
theme_gap_days: 2

themes:
  ai-this-week:
    label: AI this week
    brief: "2–3 developments that matter to a small business, with links."
    layout: list
    news: true
    min_sources: 2
    max_sources: 3
    # The 48 hours before 07:30 on a Monday are a weekend, so "this week"
    # accepts developments from the last 7 days, newest first.
    max_source_age_days: 7

  ai-finding:
    label: AI finding
    brief: "One finding from a published AI study or survey: what it found, and what it means for a small business."
    layout: headline
    news: true
    min_sources: 1
    max_sources: 2
    # Studies take longer to be written up than news, so a finding may be a
    # month old.
    max_source_age_days: 30

  from-the-toolbox:
    label: From the toolbox
    brief: "A tool from Jura's free toolbox, the newest first, with a link to try it."
    layout: tool
    needs_tool: true
    max_sources: 0

  ai-fun-facts:
    label: AI fun facts
    brief: "3–4 short, true and surprising facts about AI: its history, how it works or how people use it."
    layout: list
    min_sources: 1
    max_sources: 4

  ai-news:
    label: AI news
    brief: "One AI story from the last few days: what happened, and what it means for a small business."
    layout: headline
    news: true
    min_sources: 1
    max_sources: 2
    max_source_age_days: 3

  ai-good-read:
    label: Worth reading
    brief: "One newsletter, report, podcast or long read about AI worth a weekend's attention, and what you get from it."
    layout: headline
    min_sources: 1
    max_sources: 1

  automation-tip:
    label: Automation tip
    brief: "One small thing a team can automate this week, with AI or without."
    layout: headline
    max_sources: 2

# --- platforms (PRD §5.3) ----------------------------------------------------
#
# publish_mode is `draft` (Ting Yu posts by hand from #social-drafts) or
# `browser` (browser publishing PRD §5.10): each draft that passes the brand
# gate becomes a publish item with its own approval card in #approvals, and the
# publish job posts it through Chrome once he approves, by 18:00 on its day.
# `browser` also needs page_url, the page the run posts to; without it the
# draft is posted to #social-drafts for posting by hand. identity is the
# posting identity the run checks before typing (defaults to the Jura Solutions
# page or account). Facebook first, then Instagram, then LinkedIn (BP §5.1).
#
# enabled: false switches a platform off everywhere: no draft, no image, no
# publish item or approval card, no browser host, no setup cover and no
# LinkedIn group in the community register. Ting Yu dropped LinkedIn on
# 2026-10-29 ("No need to work on linkedin anymore"); its settings stay so it
# can be switched back on.
platforms:
  linkedin:
    label: LinkedIn page
    enabled: false
    words: [120, 220]
    hashtags_max: 3
    links: post
    image: {width: 1200, height: 627}
    publish_mode: draft
    page_url: null

  facebook:
    label: Facebook Page
    enabled: true
    words: [60, 120]
    hashtags_max: 2
    links: post
    image: {width: 1200, height: 630}
    publish_mode: draft
    page_url: null

  instagram:
    label: Instagram
    enabled: true
    words: [50, 120]
    hashtags_max: 8
    links: bio # captions don't make links clickable: write "Link in bio", no URL
    image: {width: 1080, height: 1350}
    carousel: {days: [mon, thu], max_slides: 5}
    publish_mode: draft
    page_url: null

# --- brand rules specific to social posts (PRD §4) ---------------------------

# Exactly this sentence goes in any post that mentions a grant or scheme.
eligibility_line: "Check the official page for current eligibility."

# A quotation longer than this many words fails: rewrite in Jura's own words.
max_quote_words: 12

# Topics a post never touches. Whole words or phrases, case-insensitive.
blocked_topics:
  - election
  - elections
  - electoral
  - polling day
  - general election
  - campaign rally
  - political party
  - opposition party
  - People's Action Party
  - Workers' Party
  - tragedy
  - tragic
  - fatal
  - fatalities
  - death toll
  - killed
  - murder
  - terror attack
  - terrorist
  - shooting
  - bombing
  - massacre

# Source links are fetched before a draft is accepted. A 404, 410 or an
# address that doesn't resolve sends the draft back; 401, 403 and 429 (sites
# that turn away scripts) are noted but accepted.
verify_links: true

# --- images ------------------------------------------------------------------

render:
  # JURA_GROWTH_CHROME overrides this.
  chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  # Lets the Google web fonts the design system imports finish loading.
  virtual_time_budget_ms: 8000
  timeout_seconds: 60
