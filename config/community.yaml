# Community scout settings (prd/pending/prd-jura-community-scout-2026-10-24.md).
#
# Hard limits live in jura_growth/caps.py: COMMUNITY_GROUPS_PER_WEEK (3) and
# NO_REPEAT_DAYS (14). groups_per_week here may lower the cap, never raise it;
# no_repeat_days here may lengthen the gap, never shorten it.

groups_per_week: 3 # open question 2: 3 groups a week to start
no_repeat_days: 14

post_words: {min: 60, max: 150}
reply_words: {min: 10, max: 120}
replies_per_week: {min: 2, max: 3}

# Two posts' word-trigram overlap (Jaccard) above this reads as shared text.
# Sentences of four or more words may never repeat between groups.
max_similarity: 0.25
# Posts from the last this-many days are compared too, not just this week's.
compare_days: 28

utm_source: facebook_group

# Open question 1, defaulted until Ting Yu confirms: post as Ting Yu
# personally, mentioning Jura Solutions in the closing line.
post_as: Ting Yu personally, mentioning Jura Solutions in the closing line

# The run never fetches these (settings.yaml denies WebFetch on them too), and
# they can't be a source URL. `community audit-run` checks a run's transcript.
blocked_fetch_domains: [facebook.com, fb.com, fb.me, fb.watch, fbcdn.net, facebook.net, messenger.com]
