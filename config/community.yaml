# Community scout settings (prd/pending/prd-jura-community-scout-2026-10-24.md).
#
# Hard limits live in jura_growth/caps.py: COMMUNITY_GROUPS_PER_WEEK (3) and
# NO_REPEAT_DAYS (14). groups_per_week here may lower the cap, never raise it;
# no_repeat_days here may lengthen the gap, never shorten it.

groups_per_week: 3 # open question 2: 3 groups a week to start
no_repeat_days: 14

# Browser publishing (prd/pending/prd-jura-browser-publishing-2026-10-25.md
# §5.10). With browser: true, each planned post in a group joined as the Jura
# Facebook Page, and each join `community propose-join` proposes, becomes a
# publish item with its own approval card in #approvals; the publish job acts
# on it only after Ting Yu approves. With false (the default), nothing is
# raised, and an approval already given is not claimed.
browser: false
# Group joins per ISO week (SGT). Hard limit: COMMUNITY_JOINS_PER_WEEK (3) in
# caps.py; this may lower it, never raise it.
joins_per_week: 3

post_words: {min: 60, max: 150}
reply_words: {min: 10, max: 120}
replies_per_week: {min: 2, max: 3}

# Two posts' word-trigram overlap (Jaccard) above this reads as shared text.
# Sentences of four or more words may never repeat between groups.
max_similarity: 0.25
# Posts from the last this-many days are compared too, not just this week's.
compare_days: 28

utm_source: facebook_group

# Open question 1, defaulted until Ting Yu confirms: post as Ting Yu
# personally, mentioning Jura Solutions in the closing line.
post_as: Ting Yu personally, mentioning Jura Solutions in the closing line

# The one list of domains the run may not fetch. The community job's Claude
# Code rules deny WebFetch on each domain and every subdomain of it (built from
# this list; settings.yaml has no second list). A URL on them can't be a source
# URL, and `community audit-run` checks a run's transcript for them. The code
# always adds Facebook's own domains (groups.BLOCKED_DEFAULT), so removing one
# here doesn't unblock it. Write bare domains only (example.com, not
# https://example.com/ or example.com:443): anything else stops the job.
blocked_fetch_domains: [facebook.com, fb.com, fb.me, fb.watch, fbcdn.net, facebook.net, messenger.com]
